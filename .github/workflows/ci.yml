name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore UniversalRobotsClient.NET.slnx
      - run: dotnet build UniversalRobotsClient.NET.slnx -c Release --no-restore
      - run: dotnet test UniversalRobotsClient.NET.slnx -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet pack UniversalRobotsClient.NET/UniversalRobotsClient.NET.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/tests
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error