name: NuGet Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw 'Invalid version tag' }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet restore UniversalRobotsClient.NET.slnx
      - run: dotnet build UniversalRobotsClient.NET.slnx -c Release --no-restore -p:Version=$PACKAGE_VERSION
      - run: dotnet test UniversalRobotsClient.NET.slnx -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet pack UniversalRobotsClient.NET/UniversalRobotsClient.NET.csproj -c Release --no-build -p:Version=$PACKAGE_VERSION -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: artifacts/tests
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish tested packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          dotnet nuget push 'packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate